<!DOCTYPE html>
<!-- MD Studio v1.7.0 · 2026-08-18 -->
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD Studio — 마크다운 에디터</title>
<style>
:root{
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --text:#2C2C2B; --text-sec:#7D7A75;
  --canvas:#FFFFFF; --surface:#F9F8F7; --surface2:#F0EFED;
  --border:#E6E5E3;
  --accent:#2783DE; --accent-soft:#E5F2FC;
  --green:#46A171; --green-soft:#E8F1EC;
  --orange:#D5803B; --orange-soft:#FBEBDE;
  --red:#E56458; --red-soft:#FCE9E7;
  --purple:#8A63D2;
  --raised:#FFFFFF;
  --find-bg:rgba(255,199,64,0.52); --find-cur-bg:rgba(255,141,32,0.62);
  --memo-bg:rgba(138,99,210,0.15); --memo-line:#8A63D2;
  --ed-font:ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;
  --ed-size:14px; --ed-lh:1.7;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;
  --t0:#2783DE; --t1:#46A171; --t2:#D5803B; --t3:#E56458;
  --t4:#8A63D2; --t5:#C14D8F; --t6:#0F8B8D; --t7:#9A7B00;
}
[data-theme="dark"]{
  --text:#FFFFFF; --text-sec:rgba(255,255,255,0.65);
  --canvas:#191919; --surface:#202020; --surface2:#2A2A28;
  --border:rgba(255,255,255,0.13);
  --accent:#5E9FE8; --accent-soft:rgba(94,159,232,0.14);
  --green:#72BC8F; --green-soft:rgba(114,188,143,0.14);
  --orange:#DE9255; --orange-soft:rgba(222,146,85,0.16);
  --red:#E97366; --red-soft:rgba(233,115,102,0.14);
  --purple:#BF8EDA;
  --raised:#383836;
  --find-bg:rgba(240,196,96,0.36); --find-cur-bg:rgba(226,150,80,0.56);
  --memo-bg:rgba(191,142,218,0.20); --memo-line:#BF8EDA;
  --t0:#5E9FE8; --t1:#72BC8F; --t2:#DE9255; --t3:#E97366;
  --t4:#BF8EDA; --t5:#DF84A8; --t6:#4FB9C9; --t7:#EAC26B;
}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{height:100%;margin:0;}
body{
  display:flex;flex-direction:column;
  background:var(--canvas);color:var(--text);
  font-family:var(--sans);
  transition:background-color 160ms ease,color 160ms ease;
}
body.dragging{user-select:none;cursor:col-resize;}

/* ── Top bar ─────────────────────────────── */
.topbar{
  flex:0 0 auto;height:48px;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:8px;min-width:0;}
.brand svg{color:var(--accent);flex:0 0 auto;}
.brand-name{font-weight:700;font-size:14px;letter-spacing:-0.01em;}
.brand-sub{font-size:12px;color:var(--text-sec);white-space:nowrap;}
.actions{display:flex;align-items:center;gap:6px;}
.tb-div{flex:0 0 auto;width:1px;height:18px;background:var(--border);margin:0 3px;}

/* ── Control primitive ──────────────────────────────────────────────
   모든 버튼은 고정 높이 + flex 정중앙 + line-height:1 로만 정렬한다.
   상하 padding 을 아예 쓰지 않으므로 위아래 여백이 어긋날 수 없다.
   아이콘·캐럿·숫자도 모두 flex item 이라 baseline 흔들림이 없다.      */
.ctl{
  --ctl-h:30px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  box-sizing:border-box;flex:0 0 auto;
  height:var(--ctl-h);min-width:var(--ctl-h);padding:0 10px;margin:0;
  border:1px solid var(--border);border-radius:8px;
  background:var(--canvas);color:var(--text);
  font-family:var(--sans);font-size:13px;font-weight:500;line-height:1;
  letter-spacing:-0.003em;white-space:nowrap;cursor:pointer;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  transition:background-color 120ms ease,border-color 120ms ease,color 120ms ease,box-shadow 120ms ease,transform 160ms var(--ease-out);
}
.ctl>svg{display:block;flex:0 0 auto;}
.lbl{display:block;line-height:1;}
.ctl .chev{display:block;flex:0 0 auto;opacity:0.8;transition:transform 160ms var(--ease-out);}
.ctl[aria-expanded="true"] .chev{transform:rotate(180deg);}
.ctl.icon{padding:0;width:var(--ctl-h);}
@media (hover:hover) and (pointer:fine){
  .ctl:hover{background:var(--surface);border-color:color-mix(in srgb,var(--text-sec) 30%,var(--border));}
}
.ctl:active{transform:scale(0.97);}
.ctl:focus-visible{outline:0;box-shadow:0 0 0 2px var(--canvas),0 0 0 4px color-mix(in srgb,var(--accent) 42%,transparent);}
.ctl.quiet{background:transparent;border-color:transparent;color:var(--text-sec);}
@media (hover:hover) and (pointer:fine){
  .ctl.quiet:hover{background:var(--surface2);border-color:transparent;color:var(--text);}
}
.ctl.quiet[aria-pressed="true"],.ctl.quiet[aria-expanded="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent);}
.ctl.solid{background:var(--accent);border-color:transparent;color:#FFFFFF;font-weight:600;}
@media (hover:hover) and (pointer:fine){
  .ctl.solid:hover{background:color-mix(in srgb,var(--accent) 86%,#000);border-color:transparent;}
}
.ctl .count{
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  min-width:16px;height:16px;padding:0 4px;border-radius:999px;
  background:var(--accent);color:#FFFFFF;
  font-size:10px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;
}
#btnTheme .ico-moon{display:none;}
[data-theme="dark"] #btnTheme .ico-sun{display:none;}
[data-theme="dark"] #btnTheme .ico-moon{display:block;}

/* 세그먼트 토글: 테두리는 컨테이너에 한 번만, 내부는 칩 */
.seg{
  display:inline-flex;align-items:center;gap:2px;flex:0 0 auto;
  box-sizing:border-box;height:30px;padding:2px;
  border:1px solid var(--border);border-radius:9px;background:var(--surface);
}
.seg .ctl{
  --ctl-h:24px;
  padding:0 9px;border-radius:7px;border-color:transparent;background:transparent;
  color:var(--text-sec);
}
.seg .ctl svg{opacity:0.8;}
@media (hover:hover) and (pointer:fine){
  .seg .ctl:hover{background:color-mix(in srgb,var(--text-sec) 12%,transparent);border-color:transparent;color:var(--text);}
}
.seg .ctl[aria-pressed="true"]{
  background:var(--raised);color:var(--accent);border-color:transparent;
  box-shadow:0 1px 2px rgba(0,0,0,0.06);
}
.seg .ctl[aria-pressed="true"] svg{opacity:1;}
[data-theme="dark"] .seg .ctl[aria-pressed="true"]{box-shadow:none;}

@media (pointer:coarse){
  .ctl{--ctl-h:40px;}
  .seg{height:44px;padding:3px;}
  .seg .ctl{--ctl-h:38px;}
}

/* ── Save format menu ───────────────────── */
.save-menu{
  position:fixed;top:44px;right:14px;z-index:90;width:210px;
  padding:5px;background:var(--canvas);border:1px solid var(--border);border-radius:10px;
  box-shadow:0 1px 2px rgba(0,0,0,0.06),0 8px 24px rgba(0,0,0,0.12);
  opacity:0;transform:scale(0.97) translateY(-4px);transform-origin:top right;pointer-events:none;
  transition:opacity 160ms var(--ease-out),transform 160ms var(--ease-out);
}
[data-theme="dark"] .save-menu{box-shadow:0 1px 2px rgba(0,0,0,0.4),0 8px 24px rgba(0,0,0,0.45);}
.save-menu.open{opacity:1;transform:scale(1) translateY(0);pointer-events:auto;}
.save-menu-title{padding:5px 8px 6px;font-size:11px;font-weight:600;color:var(--text-sec);}
.save-option{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:7px 8px;border:0;border-radius:7px;background:none;color:var(--text);
  font:12.5px var(--sans);cursor:pointer;text-align:left;
  transition:background-color 120ms ease,transform 160ms var(--ease-out);
}
@media (hover:hover){.save-option:hover{background:var(--surface);}}
.save-option:active{transform:scale(0.98);}
.save-option code{font:11.5px var(--ed-font);color:var(--text-sec);}
.save-option[aria-current="true"]::before{content:'✓';color:var(--accent);margin-right:7px;}
.save-option[aria-current="true"] span{margin-right:auto;}

/* ── Workspace split ─────────────────────── */
.workspace{flex:1;display:flex;min-height:0;}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;}
.editor-pane{flex:0 0 50%;}
.preview-pane{flex:1;}
.divider{flex:0 0 6px;cursor:col-resize;position:relative;}
.divider::before{
  content:'';position:absolute;left:2px;top:0;bottom:0;width:1px;
  background:var(--border);transition:background-color 120ms ease;
}
@media (hover:hover){.divider:hover::before{background:var(--accent);}}
.divider:active::before{background:var(--accent);}

.pane-header{
  flex:0 0 auto;height:34px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:0 10px 0 14px;background:var(--surface);border-bottom:1px solid var(--border);
  font-size:12px;font-weight:600;color:var(--text-sec);letter-spacing:0.01em;line-height:1;
}
.pane-header>span{display:block;line-height:1;}
/* 상태 배지도 버튼과 동일한 정렬 계산: 고정 높이 + flex 정중앙 + line-height:1 */
.tag-badge{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  box-sizing:border-box;flex:0 0 auto;height:22px;padding:0 9px;margin:0;
  border:0;border-radius:999px;
  font-family:var(--sans);font-size:12px;font-weight:600;line-height:1;
  white-space:nowrap;-webkit-font-smoothing:antialiased;
}
.tag-badge>svg{display:block;flex:0 0 auto;}
.tag-badge .bl{display:block;line-height:1;font-variant-numeric:tabular-nums;}
.tag-badge.ok{color:var(--green);background:var(--green-soft);cursor:default;}
.tag-badge.warn{
  color:var(--orange);background:var(--orange-soft);cursor:pointer;
  transition:transform 160ms var(--ease-out),background-color 120ms ease;
}
@media (hover:hover){.tag-badge.warn:hover{background:color-mix(in srgb,var(--orange) 24%,transparent);}}
.tag-badge.warn:active{transform:scale(0.96);}
.tag-badge .chev{display:block;flex:0 0 auto;opacity:0.7;transition:transform 160ms var(--ease-out);}
.tag-badge[aria-expanded="true"] .chev{transform:rotate(180deg);}

/* ── Tag issue panel ───────────────────── */
.editor-pane{position:relative;}
.tag-panel{
  position:absolute;top:38px;right:10px;z-index:30;
  min-width:230px;max-width:min(330px,90vw);max-height:280px;overflow-y:auto;
  background:var(--canvas);border:1px solid var(--border);border-radius:10px;
  box-shadow:0 1px 2px rgba(0,0,0,0.06),0 8px 24px rgba(0,0,0,0.10);
  padding:5px;transform-origin:top right;
  opacity:0;transform:scale(0.97) translateY(-4px);pointer-events:none;
  transition:opacity 160ms var(--ease-out),transform 160ms var(--ease-out);
}
[data-theme="dark"] .tag-panel{box-shadow:0 1px 2px rgba(0,0,0,0.4),0 8px 24px rgba(0,0,0,0.45);}
.tag-panel.open{opacity:1;transform:scale(1) translateY(0);pointer-events:auto;}
.tag-panel-title{padding:5px 9px 6px;font-size:11px;font-weight:600;color:var(--text-sec);letter-spacing:0.02em;}
.tag-item{
  display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;
  padding:6px 8px;border:0;background:none;border-radius:7px;cursor:pointer;
  font-family:var(--sans);font-size:12.5px;color:var(--text);text-align:left;
  transition:background-color 120ms ease,transform 160ms var(--ease-out);
}
@media (hover:hover){.tag-item:hover{background:var(--surface);}}
.tag-item:active{transform:scale(0.98);}
.tag-item-left{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;}
.tag-item .xml-chip{font-size:11px;padding:0 0.3em;flex:0 0 auto;}
.tag-item-kind{font-size:11px;color:var(--orange);flex:0 0 auto;}
.tag-item-kind.stray{color:var(--red);}
.tag-item-line{color:var(--text-sec);font-size:11px;flex:0 0 auto;}

/* 점프 대상 줄 플래시 */
.flash-line{
  position:absolute;left:0;right:0;height:calc(var(--ed-size)*var(--ed-lh));
  background:color-mix(in srgb,var(--accent) 18%,transparent);
  opacity:1;pointer-events:none;z-index:0;
  transition:opacity 900ms ease;
}

/* ── Editor ──────────────────────────────── */
.editor-wrap{flex:1;display:flex;min-height:0;overflow:hidden;}
.gutter{
  flex:0 0 46px;overflow:hidden;background:var(--canvas);
  border-right:1px solid var(--border);user-select:none;
}
.gutter-inner{
  padding:16px 8px 16px 0;text-align:right;
  font-family:var(--ed-font);font-size:var(--ed-size);line-height:var(--ed-lh);
  color:var(--text-sec);opacity:0.55;white-space:pre;
  will-change:transform;
}
.editor-area{position:relative;flex:1;min-width:0;isolation:isolate;}
#hl,#editor{
  position:absolute;inset:0;margin:0;
  padding:16px;
  box-sizing:border-box !important;
  font-family:Consolas, 'SF Mono', Monaco, Menlo, 'Courier New', monospace !important;
  font-size:14px !important;
  line-height:1.6 !important;
  font-variant-ligatures:none !important;
  letter-spacing:0px !important;
  white-space:pre-wrap !important;
  word-break:break-all !important;
  overflow-wrap:anywhere !important;
  tab-size:2 !important;
  -webkit-text-size-adjust:100%;
}
#hl{
  z-index:0;pointer-events:none;user-select:none;
  overflow:hidden;color:var(--text);
  box-sizing:border-box !important;
}
#hl code{
  font-family:inherit !important;
  font-size:inherit !important;
  line-height:inherit !important;
  letter-spacing:inherit !important;
  position:static;
  display:inline !important;
  margin:0 !important;padding:0 !important;border:0 !important;
}
#editor{
  z-index:2;background:transparent;color:transparent;caret-color:var(--accent);
  border:0;outline:0;resize:none;overflow-y:scroll;overflow-x:hidden;
  scrollbar-gutter:stable;cursor:text;user-select:text;overscroll-behavior:contain;
}
#editor:focus{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 22%,transparent);}
#editor::placeholder{color:var(--text-sec);}
#editor::selection{
  background:color-mix(in srgb,var(--accent) 32%,transparent);
  color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;
}

/* syntax tokens (100% metrics locked — strictly zero width/height alteration) */
#hl span, #hl mark{
  font-family:inherit !important;
  font-size:inherit !important;
  line-height:inherit !important;
  letter-spacing:inherit !important;
  margin:0 !important;
  padding:0 !important;
  border:0 !important;
  display:inline !important;
}
.tk-h{color:var(--accent);}
.tk-b{color:var(--orange);}
.tk-i{color:var(--purple);}
.tk-s{color:var(--text-sec);}
.tk-link{color:var(--accent);}
.tk-punc{color:var(--text-sec);opacity:0.75;}
.tk-code{background:var(--surface2);}
.tk-codeblock{background:var(--surface2);}
.tk-tag{color:var(--tag-c);background:color-mix(in srgb,var(--tag-c) 10%,transparent);}

/* tag-name → consistent color classes */
.c0{--tag-c:var(--t0);} .c1{--tag-c:var(--t1);} .c2{--tag-c:var(--t2);} .c3{--tag-c:var(--t3);}
.c4{--tag-c:var(--t4);} .c5{--tag-c:var(--t5);} .c6{--tag-c:var(--t6);} .c7{--tag-c:var(--t7);}

/* ── Find & replace ─────────────────────── */
.find-panel{
  position:absolute;top:38px;right:10px;z-index:31;
  width:min(430px,calc(100% - 20px));
  background:var(--canvas);border:1px solid var(--border);border-radius:10px;
  box-shadow:0 1px 2px rgba(0,0,0,0.06),0 8px 24px rgba(0,0,0,0.10);
  padding:8px;transform-origin:top right;
  opacity:0;transform:scale(0.98) translateY(-4px);pointer-events:none;
  transition:opacity 160ms var(--ease-out),transform 160ms var(--ease-out);
}
[data-theme="dark"] .find-panel{box-shadow:0 1px 2px rgba(0,0,0,0.4),0 8px 24px rgba(0,0,0,0.45);}
.find-panel.open{opacity:1;transform:scale(1) translateY(0);pointer-events:auto;}
.find-row{display:flex;align-items:center;gap:6px;}
.find-row+.find-row{margin-top:6px;}
.find-input-wrap{position:relative;display:flex;align-items:center;flex:1;min-width:0;}
.find-input{
  width:100%;height:32px;padding:5px 58px 5px 9px;
  border:1px solid var(--border);border-radius:7px;
  background:var(--surface);color:var(--text);outline:0;
  font:13px var(--sans);
  transition:border-color 120ms ease,box-shadow 120ms ease;
}
.find-input:focus{border-color:color-mix(in srgb,var(--accent) 60%,transparent);box-shadow:0 0 0 2px var(--accent-soft);}
.find-count{position:absolute;right:8px;font-size:10.5px;color:var(--text-sec);pointer-events:none;}
.find-mini{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  box-sizing:border-box;flex:0 0 auto;height:32px;min-width:32px;padding:0 9px;
  border:1px solid var(--border);border-radius:7px;background:var(--canvas);color:var(--text);
  font-family:var(--sans);font-size:13px;font-weight:500;line-height:1;cursor:pointer;
  transition:transform 160ms var(--ease-out),background-color 120ms ease,border-color 120ms ease,box-shadow 120ms ease;
}
.find-mini>svg{display:block;flex:0 0 auto;}
.find-mini:focus-visible{outline:0;box-shadow:0 0 0 2px var(--canvas),0 0 0 4px color-mix(in srgb,var(--accent) 42%,transparent);}
@media (hover:hover){.find-mini:hover{background:var(--surface);}}
.find-mini:active{transform:scale(0.96);}
.find-mini.primary{background:var(--accent);border-color:transparent;color:#fff;}
.find-case{display:flex;align-items:center;justify-content:center;gap:4px;height:32px;padding:0 7px;border-radius:7px;color:var(--text-sec);font-size:11px;line-height:1;white-space:nowrap;cursor:pointer;}
.find-case input{accent-color:var(--accent);}
.find-close{color:var(--text-sec);}

/* ── 지속 하이라이트 (찾기 결과 · 메모) ────
   mark 는 padding·margin·font 를 건드리지 않으므로
   에디터 오버레이(#hl)의 글자 메트릭이 전혀 변하지 않는다. */
mark.ov{padding:0;color:inherit;border-radius:2px;}
#hl mark.ov-find,.preview mark.ov-find{background:var(--find-bg);color:inherit;}
#hl mark.ov-find.cur,.preview mark.ov-find.cur{background:var(--find-cur-bg);}
.preview mark.ov-memo{
  background:var(--memo-bg);color:inherit;cursor:pointer;
  box-shadow:inset 0 -2px 0 0 color-mix(in srgb,var(--memo-line) 70%,transparent);
}
.preview mark.ov-memo.cur{background:color-mix(in srgb,var(--memo-line) 30%,transparent);}

/* ── 메모: 선택 버블 · 카드 · 목록 ──────── */
.memo-bubble{
  position:fixed;left:0;top:0;z-index:60;display:flex;align-items:center;gap:4px;padding:4px;
  background:var(--canvas);border:1px solid var(--border);border-radius:10px;
  box-shadow:0 1px 2px rgba(0,0,0,0.06),0 8px 22px rgba(0,0,0,0.12);
  opacity:0;transform:scale(0.96) translateY(4px);pointer-events:none;
  transition:opacity 140ms var(--ease-out),transform 140ms var(--ease-out);
}
.memo-bubble.open{opacity:1;transform:none;pointer-events:auto;}
.memo-card{
  position:fixed;left:0;top:0;z-index:62;width:min(330px,calc(100vw - 24px));padding:12px;
  background:var(--canvas);border:1px solid var(--border);border-radius:12px;
  box-shadow:0 1px 2px rgba(0,0,0,0.06),0 14px 34px rgba(0,0,0,0.14);
  opacity:0;transform:scale(0.97) translateY(6px);pointer-events:none;
  transition:opacity 160ms var(--ease-out),transform 160ms var(--ease-out);
}
.memo-card.open{opacity:1;transform:none;pointer-events:auto;}
.memo-quote{
  margin:0 0 10px;padding:7px 10px;border-radius:0 7px 7px 0;
  border-left:2px solid color-mix(in srgb,var(--memo-line) 60%,transparent);
  background:var(--surface);color:var(--text-sec);
  font-size:12px;line-height:1.55;max-height:62px;overflow:hidden;word-break:break-word;
}
.memo-input{
  display:block;width:100%;min-height:84px;resize:vertical;padding:9px 10px;
  border:1px solid var(--border);border-radius:8px;
  background:var(--surface);color:var(--text);font:13px/1.55 var(--sans);outline:0;
  transition:border-color 120ms ease,box-shadow 120ms ease;
}
.memo-input:focus{border-color:color-mix(in srgb,var(--accent) 60%,transparent);box-shadow:0 0 0 2px var(--accent-soft);}
.memo-card-actions{display:flex;align-items:center;gap:6px;margin-top:10px;}
.memo-card-actions .grow{margin-right:auto;}
.memo-panel{
  position:fixed;top:44px;right:14px;z-index:59;
  width:min(340px,calc(100vw - 24px));max-height:min(62vh,440px);overflow-y:auto;
  padding:6px;background:var(--canvas);border:1px solid var(--border);border-radius:12px;
  box-shadow:0 1px 2px rgba(0,0,0,0.06),0 14px 34px rgba(0,0,0,0.14);
  transform-origin:top right;
  opacity:0;transform:scale(0.97) translateY(-4px);pointer-events:none;
  transition:opacity 160ms var(--ease-out),transform 160ms var(--ease-out);
}
.memo-panel.open{opacity:1;transform:none;pointer-events:auto;}
[data-theme="dark"] .memo-bubble,[data-theme="dark"] .memo-card,[data-theme="dark"] .memo-panel{
  box-shadow:0 1px 2px rgba(0,0,0,0.4),0 14px 34px rgba(0,0,0,0.5);
}
.memo-panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 8px 9px;}
.memo-panel-title{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--text-sec);line-height:1;}
.memo-empty{padding:10px 9px 14px;font-size:12.5px;line-height:1.6;color:var(--text-sec);}
.memo-row{display:flex;align-items:flex-start;gap:2px;}
.memo-row+.memo-row{border-top:1px solid var(--border);}
.memo-item{
  display:flex;flex-direction:column;align-items:stretch;gap:5px;
  flex:1 1 auto;min-width:0;
  padding:9px 8px 9px 10px;border:0;border-radius:9px;background:none;color:var(--text);
  font-family:var(--sans);text-align:left;cursor:pointer;
  transition:background-color 120ms ease;
}
@media (hover:hover){.memo-item:hover{background:var(--surface);}}
.memo-item-q{display:flex;align-items:center;gap:5px;min-width:0;font-size:11px;line-height:1.2;color:var(--text-sec);}
.memo-item-q>svg{flex:0 0 auto;display:block;}
.memo-item-q .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.memo-item-n{
  font-size:13px;line-height:1.5;word-break:break-word;white-space:pre-wrap;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.memo-item-x{
  flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;margin-top:8px;
  border:0;border-radius:7px;background:none;color:var(--text-sec);cursor:pointer;
  transition:background-color 120ms ease,color 120ms ease;
}
@media (hover:hover){.memo-item-x:hover{background:var(--red-soft);color:var(--red);}}
.memo-orphan{flex:0 0 auto;color:var(--orange);}

/* ── Preview ─────────────────────────────── */
.preview{
  flex:1;overflow:auto;padding:24px 32px 72px;
  font-size:16px;line-height:1.65;
}
.preview:empty::before{
  content:'미리보기가 여기에 표시됩니다.';
  color:var(--text-sec);font-size:14px;
}
.preview h1{font-size:1.7em;margin:0.4em 0 0.5em;line-height:1.3;letter-spacing:-0.01em;}
.preview h2{font-size:1.42em;margin:1.2em 0 0.4em;line-height:1.35;}
.preview h3{font-size:1.2em;margin:1.2em 0 0.35em;}
.preview h4,.preview h5,.preview h6{font-size:1.05em;margin:1em 0 0.3em;}
.preview p{margin:0.5em 0;}
.preview ul,.preview ol{margin:0.4em 0;padding-left:1.5em;}
.preview li{margin:0.15em 0;}
.preview li.task{list-style:none;margin-left:-1.25em;}
.preview li.task input{
  margin-right:0.45em;accent-color:var(--accent);
  width:14px;height:14px;transform:translateY(2px);
}
.preview blockquote{
  margin:0.6em 0;padding:0.1em 0 0.1em 1em;
  border-left:3px solid color-mix(in srgb,var(--accent) 40%,transparent);
  color:var(--text-sec);
}
.preview code{
  font-family:var(--ed-font);font-size:0.86em;
  background:var(--surface2);padding:0.12em 0.35em;border-radius:4px;
}
.preview .code-block{
  position:relative;margin:0.7em 0;padding:12px 14px;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  overflow-x:auto;font-size:13px;line-height:1.6;
}
.preview .code-block code{background:none;padding:0;font-size:inherit;}
.preview .code-lang{
  position:absolute;top:6px;right:10px;
  font-family:var(--sans);font-size:10px;font-weight:600;
  color:var(--text-sec);text-transform:uppercase;letter-spacing:0.05em;
}
.preview table{border-collapse:collapse;margin:0.7em 0;font-size:14.5px;}
.preview th,.preview td{border:1px solid var(--border);padding:6px 12px;text-align:left;}
.preview th{background:var(--surface);font-weight:600;}
.preview hr{border:0;border-top:1px solid var(--border);margin:1.4em 0;}
.preview img{max-width:100%;border-radius:8px;}
.preview a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 40%,transparent);}

/* XML tags as visible colored chips */
.xml-chip{
  font-family:var(--ed-font);font-size:0.8em;
  padding:0 0.35em;border-radius:4px;
  color:var(--tag-c);
  background:color-mix(in srgb,var(--tag-c) 9%,transparent);
  border:1px solid color-mix(in srgb,var(--tag-c) 26%,transparent);
}
.preview.hide-tags .xml-chip{display:none;}

/* ── Status bar / toast ──────────────────── */
.statusbar{
  flex:0 0 auto;height:30px;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;border-top:1px solid var(--border);background:var(--surface);
  font-size:12px;color:var(--text-sec);gap:12px;
}
.stats{display:flex;gap:14px;white-space:nowrap;min-width:0;}
.stats.right{overflow:hidden;}
.hint{opacity:0.75;overflow:hidden;text-overflow:ellipsis;}

.toast{
  position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(0);
  background:var(--text);color:var(--canvas);
  font-size:13px;font-weight:500;padding:8px 14px;border-radius:8px;
  opacity:0;pointer-events:none;
  transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{
  background:color-mix(in srgb,var(--text-sec) 32%,transparent);
  border-radius:5px;border:2px solid var(--canvas);
}
::-webkit-scrollbar-track{background:transparent;}

@media (max-width:760px){
  .topbar{padding:0 8px;gap:6px;overflow:hidden;}
  .brand{flex:0 0 18px;}
  .brand-name,.brand-sub,.hint{display:none;}
  .actions{min-width:0;max-width:calc(100vw - 40px);overflow-x:auto;scrollbar-width:none;}
  .actions::-webkit-scrollbar{display:none;}
  .workspace{flex-direction:column;}
  .editor-pane{flex:0 0 50%;}
  .divider{flex:0 0 6px;cursor:row-resize;}
  .divider::before{left:0;right:0;top:2px;width:auto;height:1px;}
  .find-panel{right:6px;width:calc(100% - 12px);}
  .save-menu,.memo-panel{right:8px;}
  .find-mini{padding:0 8px;}
  .find-case{padding:0 4px;}
}
@media (max-width:900px){
  .brand-sub{display:none;}
  .actions .lbl.opt{display:none;}
  .ctl{padding:0 9px;}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:0.01ms !important;animation:none !important;}
}

/* ── Luxury Micro-Tooltip (Emil Kowalski / Apple Design) ── */
.app-tooltip {
  position: fixed;
  z-index: 9999;
  pointer-events: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: 320px;
  padding: 5px 9px;
  border-radius: 7px;
  font-family: var(--sans);
  font-size: 11.5px;
  font-weight: 500;
  line-height: 1.35;
  letter-spacing: -0.015em;
  white-space: nowrap;
  background: rgba(20, 20, 22, 0.90);
  color: #FFFFFF;
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.28), 0 1px 4px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  opacity: 0;
  transform: translateY(-4px) scale(0.96);
  filter: blur(1.5px);
  transition: opacity 140ms cubic-bezier(0.23, 1, 0.32, 1), transform 140ms cubic-bezier(0.23, 1, 0.32, 1), filter 140ms ease;
  will-change: transform, opacity, filter;
}
[data-theme="dark"] .app-tooltip {
  background: rgba(36, 36, 40, 0.92);
  border-color: rgba(255, 255, 255, 0.16);
  box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5), 0 1px 4px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.18);
}
.app-tooltip.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
  filter: blur(0px);
}
.app-tooltip.instant {
  transition-duration: 0ms !important;
}
.app-tooltip .tip-kbd {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 1px 4px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.18);
  color: rgba(255, 255, 255, 0.92);
  font-family: var(--ed-font);
  font-size: 10px;
  font-weight: 500;
  line-height: 1.1;
  letter-spacing: 0;
}

/* ── HTML 5 & Block Elements in Preview ── */
/* ── Clean details & summary defaults without color interference ── */
.preview details {
  border: 0;
  background: transparent;
}
.preview summary {
  cursor: pointer;
  outline: 0;
  user-select: none;
}
.preview summary::-webkit-details-marker {
  color: var(--accent);
}
.preview iframe, .preview video, .preview audio {
  max-width: 100%;
  border-radius: 8px;
}
.preview iframe {
  border: 1px solid var(--border);
}
.preview kbd {
  display: inline-block;
  padding: 2px 5px;
  font-size: 0.85em;
  font-family: var(--ed-font);
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  box-shadow: 0 1px 0 var(--border);
}
.preview mark {
  background: var(--find-bg);
  color: inherit;
  padding: 0 2px;
  border-radius: 2px;
}


/* ── TOC Minimap & Floating Outline (Emil / Notion Style) ── */
.preview-wrap {
  position: relative;
  flex: 1;
  min-height: 0;
  display: flex;
  overflow: hidden;
}
.preview-wrap .preview {
  padding-right: 48px;
}
.toc-minimap {
  position: absolute;
  right: 10px;
  top: 24px;
  bottom: 24px;
  width: 20px;
  z-index: 15;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: flex-start;
  gap: 5px;
  cursor: pointer;
  padding: 6px 0;
  user-select: none;
}
.toc-dash {
  height: 2px;
  border-radius: 1px;
  background: color-mix(in srgb, var(--text-sec) 32%, transparent);
  transition: transform 140ms var(--ease-out), background-color 120ms ease, width 140ms var(--ease-out);
  transform-origin: right center;
}
.toc-dash.rel-0 { width: 16px; height: 2.5px; }
.toc-dash.rel-1 { width: 12px; height: 2px; }
.toc-dash.rel-2 { width: 8px; height: 1.5px; }
.toc-dash.rel-3, .toc-dash.rel-4, .toc-dash.rel-5, .toc-dash.rel-6 { width: 5px; height: 1.5px; }

.toc-dash.active {
  background: var(--accent) !important;
  width: 18px !important;
  height: 3px !important;
  border-radius: 2px;
  box-shadow: 0 0 8px var(--accent-soft);
}
@media (hover: hover) {
  .toc-minimap:hover .toc-dash {
    background: color-mix(in srgb, var(--text-sec) 70%, transparent);
  }
  .toc-dash:hover {
    background: var(--accent) !important;
    transform: scaleX(1.3);
  }
}
.toc-popover {
  position: absolute;
  right: 34px;
  top: 18px;
  width: 280px;
  max-height: min(520px, calc(100% - 36px));
  display: flex;
  flex-direction: column;
  background: rgba(255, 255, 255, 0.94);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 4px 24px -2px rgba(0, 0, 0, 0.14), 0 1px 4px rgba(0, 0, 0, 0.06);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  z-index: 25;
  transform-origin: top right;
  opacity: 0;
  transform: scale(0.96) translateX(8px);
  pointer-events: none;
  transition: opacity 160ms var(--ease-out), transform 160ms var(--ease-out);
}
[data-theme="dark"] .toc-popover {
  background: rgba(26, 26, 30, 0.94);
  box-shadow: 0 4px 24px -2px rgba(0, 0, 0, 0.5), 0 1px 4px rgba(0, 0, 0, 0.25);
}
.toc-popover.open {
  opacity: 1;
  transform: scale(1) translateX(0);
  pointer-events: auto;
}
.toc-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px 8px;
  border-bottom: 1px solid var(--border);
}
.toc-title {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--text-sec);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.toc-count {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-sec);
  font-variant-numeric: tabular-nums;
}
.toc-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.toc-item {
  display: flex;
  align-items: center;
  width: 100%;
  padding: 6px 8px;
  border: 0;
  border-radius: 7px;
  background: none;
  color: var(--text-sec);
  font-family: var(--sans);
  line-height: 1.35;
  text-align: left;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background-color 120ms ease, color 120ms ease, transform 140ms var(--ease-out);
  box-sizing: border-box;
}
.toc-item .toc-item-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1 1 auto;
}

/* Adaptive Indentation & Hierarchy Typography */
.toc-item.rel-0 {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  padding-left: 8px;
}
.toc-item.rel-1 {
  font-size: 12.5px;
  font-weight: 550;
  padding-left: 20px;
  position: relative;
}
.toc-item.rel-1::before {
  content: '';
  position: absolute;
  left: 10px;
  top: 50%;
  width: 5px;
  height: 1px;
  background: color-mix(in srgb, var(--text-sec) 30%, transparent);
}
.toc-item.rel-2 {
  font-size: 12px;
  font-weight: 450;
  padding-left: 32px;
  position: relative;
}
.toc-item.rel-2::before {
  content: '';
  position: absolute;
  left: 20px;
  top: 50%;
  width: 6px;
  height: 1px;
  background: color-mix(in srgb, var(--text-sec) 25%, transparent);
}
.toc-item.rel-3, .toc-item.rel-4, .toc-item.rel-5, .toc-item.rel-6 {
  font-size: 11.5px;
  font-weight: 400;
  padding-left: 42px;
  opacity: 0.88;
}

@media (hover: hover) {
  .toc-item:hover {
    background: var(--surface);
    color: var(--text);
  }
}

/* Precise Active Indicator matching the minimap bar */
.toc-item.active {
  color: var(--accent) !important;
  font-weight: 700 !important;
  background: color-mix(in srgb, var(--accent) 12%, transparent) !important;
  box-shadow: inset 3px 0 0 0 var(--accent);
}
.toc-item:active {
  transform: scale(0.98);
}

/* ── Preview & Editor Flash Highlights ── */
@keyframes flashPreviewHeadingAnim {
  0% {
    background-color: color-mix(in srgb, var(--accent) 26%, transparent);
    box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  100% {
    background-color: transparent;
    box-shadow: 0 0 0 0 transparent;
  }
}
.flash-preview-heading {
  border-radius: 6px;
  animation: flashPreviewHeadingAnim 1200ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}

</style>
</head>

  <div class="brand">
    <svg width="17" height="17" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <rect x="1.2" y="1.2" width="13.6" height="13.6" rx="3.2" stroke="currentColor" stroke-width="1.5"/>

      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="2"/><path d="M10.5 3.6V3a1.4 1.4 0 0 0-1.4-1.4H3A1.4 1.4 0 0 0 1.6 3v6.1A1.4 1.4 0 0 0 3 10.5h.6"/></svg>
      <span class="lbl">복사</span>

      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6.9" cy="6.9" r="4.4"/><path d="M10.2 10.2 14 14"/></svg>

    <button class="ctl quiet" id="btnMemo" type="button" aria-haspopup="dialog" aria-pressed="false" aria-label="메모 목록" data-tooltip="메모 목록 — 드래그하여 메모 생성">
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.6 3.8A1.4 1.4 0 0 1 4 2.4h8a1.4 1.4 0 0 1 1.4 1.4v5.6A1.4 1.4 0 0 1 12 10.8H6.6l-2.9 2.6a.5.5 0 0 1-.8-.4v-2.2H4a1.4 1.4 0 0 1-1.4-1.4Z"/><path d="M5.4 5.6h5.2M5.4 7.9h3.2"/></svg>
      <span class="lbl opt">메모</span>
      <span class="count" id="memoCount" hidden>0</span>
    </button>
    <span class="tb-div" aria-hidden="true"></span>

      <button class="ctl" id="btnTags" type="button" aria-pressed="true" aria-label="XML 태그 표시/숨기기" data-tooltip="미리보기에서 XML 태그 표시/숨기기"><span class="lbl">태그</span></button>

      <button class="ctl" id="btnSync" type="button" aria-pressed="true" aria-label="스크롤 동기화" data-tooltip="에디터와 미리보기 스크롤 동기화"><span class="lbl">동기화</span></button>

    <button class="ctl quiet icon" id="btnTheme" type="button" aria-label="다크 모드로 전환" data-tooltip="다크 모드로 전환">
      <svg class="ico-sun" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="3.1"/><path d="M8 1.2v1.5M8 13.3v1.5M1.2 8h1.5M13.3 8h1.5M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M12.8 3.2l-1.1 1.1M4.3 11.7l-1.1 1.1"/></svg>

function extractAndProtectHtmlBlocks(src) {
  const blocks = [];
  const lines = src.replace(/\r\n?/g, '\n').split('\n');
  const result = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];
    const match = line.match(/^\s*<([a-zA-Z][\w:.-]*)/);

    if (match && HTML_BLOCK_TAGS.has(match[1].toLowerCase())) {
      const tagLower = match[1].toLowerCase();
      const blockLines = [];
      let depth = 0;
      let started = false;

      while (i < lines.length) {
        const curLine = lines[i];
        blockLines.push(curLine);

        const tagMatches = curLine.matchAll(/<(\/?)([a-zA-Z][\w:.-]*)[^>]*>/g);
        for (const tm of tagMatches) {
          const isClose = tm[1] === '/';
          const name = tm[2].toLowerCase();
          const isSelfClosing = tm[0].endsWith('/>') || HTML_VOID_TAGS.has(name);

          if (name === tagLower) {
            started = true;
            if (isClose) depth--;

        i++;
        if (started && depth <= 0) break;
      }

      blocks.push(blockLines.join('\n'));

    } else {

      i++;

}

  const tocMinimap = document.getElementById('tocMinimap');

function findHeadingInEditor(idx, text) {
  const src = editor.value;

  let count = 0;
  let found = null;

  while ((match = re.exec(src)) !== null) {
    const rawHeadingText = match[2].trim();
    if (count === idx) {
      return { start: match.index, end: match.index + match[0].length, line: src.slice(0, match.index).split('\n').length };
    }
    count++;
  }
  return null;
}

function updateTableOfContents() {
  const tocMinimap = document.getElementById('tocMinimap');
  const tocPopover = document.getElementById('tocPopover');
  const tocList = document.getElementById('tocList');
  const tocCount = document.getElementById('tocCount');
  if (!tocMinimap || !tocPopover || !tocList) return;

  const headings = preview.querySelectorAll('h1, h2, h3, h4, h5, h6');
  if (!headings.length) {
    tocMinimap.hidden = true;
    tocPopover.hidden = true;
    tocItems = [];
    return;
  }

  tocMinimap.hidden = false;
  if (tocCount) tocCount.textContent = headings.length + '개';

  // Find minimum heading level for relative hierarchy scaling
  const levels = Array.from(headings).map(h => parseInt(h.tagName.substring(1), 10));
  const minLevel = Math.min(...levels);

  let minimapHtml = '';

  headings.forEach((h, idx) => {
    const id = 'heading-' + idx;
    h.id = id;
    const level = parseInt(h.tagName.substring(1), 10);
    const relLevel = Math.max(0, level - minLevel);
    const text = h.textContent.trim();

    tocItems.push({ id, level, relLevel, el: h, text });

    minimapHtml += '<div class="toc-dash rel-' + relLevel + '" data-idx="' + idx + '" data-tooltip="' + escapeHtml(text) + '"></div>';
    listHtml += '<button type="button" class="toc-item rel-' + relLevel + '" data-idx="' + idx + '"><span class="toc-item-text">' + escapeHtml(text) + '</span></button>';

  tocList.innerHTML = listHtml;

  tocMinimap.querySelectorAll('.toc-dash').forEach(dash => {
    dash.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(dash.getAttribute('data-idx'), 10);
      jumpToHeading(idx);

    item.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(item.getAttribute('data-idx'), 10);

  claimRecentOwner('preview', 500);
  const targetTop = getHeadingTopInPreview(target.el) - 16;
  preview.scrollTo({ top: Math.max(0, targetTop), behavior: 'smooth' });

  // Apply blue flashing highlight to preview heading
  target.el.classList.remove('flash-preview-heading');
  void target.el.offsetWidth; // trigger reflow
  target.el.classList.add('flash-preview-heading');
  setTimeout(() => {
    if (target.el) target.el.classList.remove('flash-preview-heading');
  }, 1300);

  // 2. Smooth scroll and blue flashing highlight in Editor (matching Ctrl+F)
  const edHit = findHeadingInEditor(idx, target.text);
  if (edHit) {
    editor.setSelectionRange(edHit.start, edHit.end);
    const top = measureLineTop(edHit.start);
    editor.scrollTo({ top: Math.max(0, top - editor.clientHeight / 2), behavior: 'smooth' });
    mirrorScroll();
    flashLine(top);
    updateCursor();
  }

  // 3. Immediately update active state
  highlightActiveToc(idx);
}

function highlightActiveToc(activeIdx) {
  const tocMinimap = document.getElementById('tocMinimap');
  const tocPopover = document.getElementById('tocPopover');
  const tocList = document.getElementById('tocList');
  if (!tocMinimap || !tocList) return;

  const dashes = tocMinimap.querySelectorAll('.toc-dash');
  const items = tocList.querySelectorAll('.toc-item');

  dashes.forEach((d, i) => d.classList.toggle('active', i === activeIdx));
  items.forEach((it, i) => {
    const isActive = i === activeIdx;
    it.classList.toggle('active', isActive);
    if (isActive && tocPopover && tocPopover.classList.contains('open')) {
      it.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  });
}

function syncTocActiveState() {
  const tocMinimap = document.getElementById('tocMinimap');
  const tocList = document.getElementById('tocList');
  if (!tocItems.length || !tocMinimap || !tocList) return;

  const scrollTop = preview.scrollTop;
  const isAtBottom = scrollTop + preview.clientHeight >= preview.scrollHeight - 16;

  let activeIdx = 0;
  if (isAtBottom) {
    activeIdx = tocItems.length - 1;
  } else {
    const threshold = scrollTop + 70;
    for (let i = 0; i < tocItems.length; i++) {
      const headingTop = getHeadingTopInPreview(tocItems[i].el);
      if (headingTop <= threshold) {
        activeIdx = i;
      } else {
        break;
      }
    }
  }

  highlightActiveToc(activeIdx);
}


/* ── editor highlight (must preserve every visible char) ── */
function highlight(src){
  const blocks = [], codes = [];
  let t = escapeHtml(src);
  t = t.replace(/```(\w*)[ \t]*\n([\s\S]*?)(\n```|$)/g, (m,lang,body,close)=>{
    blocks.push('<span class="tk-punc">```'+lang+'</span>\n<span class="tk-codeblock">'+body+'</span>'+(close?'<span class="tk-punc">'+close+'</span>':''));
    return '\u0001'+(blocks.length-1)+'\u0001';
  });
  t = t.replace(/`([^`\n]+)`/g, (m,c)=>{ codes.push(c); return '\u0000'+(codes.length-1)+'\u0000'; });
  t = t.replace(/&lt;(\/?)([A-Za-z][\w:.-]*)((?:(?!&gt;)[\s\S])*?)&gt;/g,
    (m,sl,n)=>'<span class="tk-tag c'+tagIndex(n.toLowerCase())+'">'+m+'</span>');
  t = t.replace(/^(#{1,6}\s.*)$/gm, '<span class="tk-h">$1</span>');
  t = t.replace(/^(\s*(?:-{3,}|\*{3,}|_{3,})\s*)$/gm, '<span class="tk-punc">$1</span>');
  t = t.replace(/^(\s*&gt;)/gm, '<span class="tk-punc">$1</span>');
  t = t.replace(/^(\s*)((?:[-*+]|\d+[.)])\s)/gm, '$1<span class="tk-punc">$2</span>');
  t = t.replace(/\*\*((?:(?!\*\*)[^\n])+)\*\*/g, '<span class="tk-b">**$1**</span>');
  t = t.replace(/(^|[^\w])__([^_]+)__/g, '$1<span class="tk-b">__$2__</span>');
  t = t.replace(/(?<![\w*])\*([^*\n]+)\*(?![\w*])/g, '<span class="tk-i">*$1*</span>');
  t = t.replace(/(?<![\w_])_([^_\n]+)_(?![\w_])/g, '<span class="tk-i">_$1_</span>');
  t = t.replace(/~~([^~]+)~~/g, '<span class="tk-s">~~$1~~</span>');
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<span class="tk-punc">[</span><span class="tk-link">$1</span><span class="tk-punc">]($2)</span>');
  t = t.replace(/\u0000(\d+)\u0000/g, (m,i)=>'<span class="tk-code">`'+codes[+i]+'`</span>');
  t = t.replace(/\u0001(\d+)\u0001/g, (m,i)=>blocks[+i]);
  return t;
}

/* ── status & diagnostics ──────────────── */
function updateGutter(src){
  const n = src.split('\n').length;
  if (n===lineCount) return;
  lineCount = n;
  let s = '';
  for (let i=1;i<=n;i++) s += i+'\n';
  gutterInner.textContent = s;
}
function updateStats(src){
  const chars = src.length;
  const words = (src.match(/\S+/g)||[]).length;
  const lines = src.split('\n').length;
  const cjk = (src.match(/[\u1100-\u11FF\u3130-\u318F\uAC00-\uD7AF\u4E00-\u9FFF\u3040-\u30FF]/g)||[]).length;
  const latinWords = (src.match(/[A-Za-z0-9_'-]+/g)||[]).length;
  const tokens = Math.ceil(cjk*1.4 + latinWords*1.3 + (chars-cjk)/20);
  statChars.textContent = chars.toLocaleString()+'자';
  statWords.textContent = words.toLocaleString()+'단어';
  statTokens.textContent = '≈'+tokens.toLocaleString()+' 토큰';
  statLines.textContent = lines.toLocaleString()+'줄';
}
function updateCursor(){
  const pos = editor.selectionStart;
  const before = editor.value.slice(0,pos);
  const line = before.split('\n').length;
  const col = pos - before.lastIndexOf('\n');
  statCursor.textContent = 'Ln '+line+', Col '+col;
}
/* ── tag diagnostics + jump-to-tag ─────── */
let tagIssues = [];
let tagPanelOpen = false;
function maskCodeForTagScan(src){
  const mask = s=>s.replace(/[^\n]/g,' ');
  let out = src.replace(/```[\s\S]*?(?:```|$)/g,mask);
  out = out.replace(/(`+)([^\n]*?)\1/g,mask);
  return out;
}
function findTagIssues(src){
  const scan = maskCodeForTagScan(src);
  const re = /<(\/?)([A-Za-z][\w:.-]*)((?:"[^"]*"|'[^']*'|[^>"'])*)>/g;
  const stack = [], issues = [];
  let m;
  while ((m = re.exec(scan))){
    const tagLower=m[2].toLowerCase();
    if (m[0].endsWith('/>')||HTML_STANDARD_TAGS.has(tagLower)) continue;
    if (!m[1]) stack.push({ name:m[2], offset:m.index, len:m[0].length });
    else {
      let idx = -1;
      for (let k=stack.length-1;k>=0;k--){ if (stack[k].name===m[2]){ idx=k; break; } }
      if (idx===-1) issues.push({ name:m[2], kind:'stray', offset:m.index, len:m[0].length });
      else stack.splice(idx,1);
    }
  }
  stack.forEach(s=>issues.push({ name:s.name, kind:'unclosed', offset:s.offset, len:s.len }));
  issues.sort((a,b)=>a.offset-b.offset);
  return issues;
}
function updateTagStatus(src){
  tagIssues = findTagIssues(src);
  if (!tagIssues.length){
    tagStatus.innerHTML = ICON.check+'<span class="bl">태그 균형</span>';
    tagStatus.className = 'tag-badge ok';
    tagStatus.setAttribute('aria-expanded','false');
    tagStatus.dataset.tooltip = '모든 태그가 짝을 이루고 있습니다';
    closeTagPanel();
  } else {
    const unclosed = tagIssues.filter(i=>i.kind==='unclosed').length;
    const stray = tagIssues.length - unclosed;
    const parts = [];
    if (unclosed) parts.push('미닫힘 '+unclosed);
    if (stray) parts.push('짝없음 '+stray);
    tagStatus.innerHTML = ICON.warn+'<span class="bl">'+parts.join(' · ')+'</span>'+ICON.chev;
    tagStatus.className = 'tag-badge warn';
    tagStatus.title = '클릭하면 문제 위치 목록이 열립니다';
    if (tagPanelOpen) renderTagPanel();
  }
}
function openTagPanel(){
  if (!tagIssues.length) return;
  closeFindPanel(false);
  tagPanelOpen = true;
  renderTagPanel();
  tagPanel.hidden = false;
  requestAnimationFrame(()=>requestAnimationFrame(()=>tagPanel.classList.add('open')));
  tagStatus.setAttribute('aria-expanded','true');
}
function closeTagPanel(){
  if (tagPanel.hidden) return;
  tagPanelOpen = false;
  tagPanel.classList.remove('open');
  tagStatus.setAttribute('aria-expanded','false');
  setTimeout(()=>{ if (!tagPanelOpen) tagPanel.hidden = true; },180);
}
tagStatus.addEventListener('click', ()=>{
  if (!tagIssues.length) return;
  if (tagPanelOpen) closeTagPanel(); else openTagPanel();
});
document.addEventListener('pointerdown', (e)=>{
  if (tagPanelOpen && !tagPanel.contains(e.target) && !tagStatus.contains(e.target)) closeTagPanel();
});
document.addEventListener('keydown', (e)=>{
  if (e.key==='Escape' && tagPanelOpen) closeTagPanel();
});
function renderTagPanel(){
  tagList.innerHTML = '';
  const src = editor.value;
  tagIssues.slice(0,100).forEach(issue=>{
    const line = src.slice(0,issue.offset).split('\n').length;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tag-item';
    const kindLabel = issue.kind==='unclosed' ? '미닫힘' : '짝없는 닫힘';
    const chip = '<span class="xml-chip c'+tagIndex(issue.name.toLowerCase())+'">&lt;'+(issue.kind==='unclosed'?'':'/')+issue.name+'&gt;</span>';
    btn.innerHTML = '<span class="tag-item-left">'+chip+'<span class="tag-item-kind '+(issue.kind==='unclosed'?'':'stray')+'">'+kindLabel+'</span></span><span class="tag-item-line">'+line+'줄</span>';
    btn.addEventListener('click', ()=>{ jumpToTag(issue); closeTagPanel(); });
    tagList.appendChild(btn);
  });
}
/* 미러 div로 줄 픽셀 위치 측정 (에디터와 동일 메트릭스) */
let mirror = null;
function measureLineTop(offset){
  if (!mirror){
    mirror = document.createElement('div');
    mirror.setAttribute('aria-hidden','true');
    mirror.style.cssText = 'position:absolute;top:0;left:0;visibility:hidden;white-space:pre-wrap;word-break:break-word;box-sizing:border-box;';
    editorArea.appendChild(mirror);
  }
  const cs = getComputedStyle(editor);
  mirror.style.fontFamily = cs.fontFamily;
  mirror.style.fontSize = cs.fontSize;
  mirror.style.lineHeight = cs.lineHeight;
  mirror.style.padding = cs.padding;
  mirror.style.tabSize = cs.tabSize;
  mirror.style.width = editor.clientWidth+'px';
  mirror.textContent = editor.value.slice(0,offset);
  const marker = document.createElement('span');
  marker.textContent = '\u200b';
  mirror.appendChild(marker);
  return marker.offsetTop;
}
function flashLine(top){
  const f = document.createElement('div');
  f.className = 'flash-line';
  f.style.top = top+'px';
  hl.appendChild(f);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ f.style.opacity = '0'; }));
  const kill = ()=>{ f.remove(); };
  f.addEventListener('transitionend', kill);
  setTimeout(kill, 1600);
}
function jumpToTag(issue){
  const top = measureLineTop(issue.offset);
  editor.focus();
  editor.setSelectionRange(issue.offset, issue.offset+issue.len);
  editor.scrollTo({ top:Math.max(0, top-(editor.clientHeight/2)), behavior:'smooth' });
  mirrorScroll();
  flashLine(top);
}

/* ── Find & replace ────────────────────── */
/* ── 지속 하이라이트 엔진 ──────────
   에디터 오버레이(#hlCode)와 미리보기(.preview)의 텍스트를
   변경하지 않고 <mark> 로만 감싸다. 문자 오프셋 기준이므로
   글자 위치·줄바꿈이 어긋나지 않는다. */
function unwrapMarks(root, selector){
  if (!root) return;
  root.querySelectorAll(selector).forEach(m=>{
    const parent = m.parentNode;
    if (!parent) return;
    while (m.firstChild) parent.insertBefore(m.firstChild, m);
    parent.removeChild(m);
  });
  root.normalize();
}
function textNodeMap(root){
  const out = [];
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let offset = 0, n;
  while ((n = walker.nextNode())){
    const len = n.nodeValue.length;
    if (len) out.push({node:n, start:offset, end:offset+len});
    offset += len;
  }
  return out;
}
function paintRanges(root, ranges, opts){
  if (!root || !ranges || !ranges.length) return;
  const map = textNodeMap(root);
  const byNode = new Map();
  for (const r of ranges){
    if (r.end <= r.start) continue;
    for (const t of map){
      if (t.end <= r.start || t.start >= r.end) continue;
      const from = Math.max(r.start, t.start) - t.start;
      const to = Math.min(r.end, t.end) - t.start;
      if (to <= from) continue;
      if (!byNode.has(t.node)) byNode.set(t.node, []);
      byNode.get(t.node).push({from, to, ref:r});
    }
  }
  byNode.forEach((segs, node)=>{
    segs.sort((a,b)=> b.from - a.from);
    for (const s of segs){
      if (s.to > node.nodeValue.length) continue;
      if (s.to < node.nodeValue.length) node.splitText(s.to);
      const target = s.from > 0 ? node.splitText(s.from) : node;
      const mk = document.createElement('mark');
      mk.className = 'ov ' + opts.cls + ((opts.isCurrent && opts.isCurrent(s.ref)) ? ' cur' : '');
      if (opts.memoId) mk.dataset.memo = opts.memoId(s.ref);
      const tip = opts.title ? opts.title(s.ref) : '';
      if (tip) mk.title = tip;
      target.parentNode.insertBefore(mk, target);
      mk.appendChild(target);
      if (target === node) break;
    }
  });
}
function collectMatches(text, needle, sensitive){
  if (!needle) return [];
  const hay = sensitive ? text : text.toLocaleLowerCase();
  const query = sensitive ? needle : needle.toLocaleLowerCase();
  const out = [];
  let pos = 0;
  while ((pos = hay.indexOf(query, pos)) !== -1){
    out.push({start:pos, end:pos+needle.length});
    pos += Math.max(needle.length, 1);
  }
  return out;
}
/* 찾은 모든 일치항을 지속 표시하고, 현재 항목은 진한 색으로 구분 */
function paintFindHighlights(){
  unwrapMarks(hlCode, 'mark.ov-find');
  unwrapMarks(preview, 'mark.ov-find');
  if (!findOpen || !findInput.value) return;
  const cur = findMatches[findIndex];
  paintRanges(hlCode, findMatches, {cls:'ov-find', isCurrent:r=>r===cur});
  paintRanges(preview, collectMatches(preview.textContent, findInput.value, findCase.checked), {cls:'ov-find'});
}

let findOpen = false, findMatches = [], findIndex = -1;
function openFindPanel(){
  closeTagPanel();
  findOpen = true;
  findPanel.hidden = false;
  btnFind.setAttribute('aria-pressed','true');
  const selected = editor.value.slice(editor.selectionStart,editor.selectionEnd);
  if (selected && !selected.includes('\n') && selected.length<=120) findInput.value = selected;
  refreshFind(false);
  requestAnimationFrame(()=>requestAnimationFrame(()=>findPanel.classList.add('open')));
  findInput.focus();
  findInput.select();
}
function closeFindPanel(restoreFocus=true){
  if (!findOpen && findPanel.hidden) return;
  findOpen = false;
  findPanel.classList.remove('open');
  btnFind.setAttribute('aria-pressed','false');
  paintFindHighlights();
  setTimeout(()=>{ if (!findOpen) findPanel.hidden = true; },180);
  if (restoreFocus) editor.focus({preventScroll:true});
}
function collectFindMatches(){
  return collectMatches(editor.value, findInput.value, findCase.checked);
}
function updateFindCount(){
  findCount.textContent = findMatches.length ? (findIndex+1)+'/'+findMatches.length : '0/0';
}
function revealFind(index, focusEditor=false){
  if (!findMatches.length){ findIndex=-1; updateFindCount(); return; }
  findIndex = (index+findMatches.length)%findMatches.length;
  const hit = findMatches[findIndex];
  editor.setSelectionRange(hit.start,hit.end);
  const top = measureLineTop(hit.start);
  claimRecentOwner('editor',280);
  editor.scrollTop = Math.max(0,top-editor.clientHeight/2);
  mirrorScroll();
  if (syncOn) applyScrollRatio(preview,editor);
  flashLine(top);
  updateCursor();
  updateFindCount();
  paintFindHighlights();
  if (focusEditor) editor.focus({preventScroll:true});
}
function refreshFind(jump=true){
  const anchor = editor.selectionStart;
  findMatches = collectFindMatches();
  if (!findMatches.length){ findIndex=-1; updateFindCount(); paintFindHighlights(); return; }
  const next = findMatches.findIndex(m=>m.start>=anchor);
  findIndex = next===-1 ? 0 : next;
  updateFindCount();
  if (jump) revealFind(findIndex,false); else paintFindHighlights();
}
function stepFind(delta){
  if (!findMatches.length) refreshFind(false);
  if (findMatches.length) revealFind((findIndex<0?0:findIndex)+delta,false);
}
function replaceCurrent(){
  if (!findMatches.length) refreshFind(false);
  if (!findMatches.length) return;
  const hit = findMatches[Math.max(0,findIndex)];
  editor.setRangeText(replaceInput.value,hit.start,hit.end,'end');
  update();
  refreshFind(false);
  if (findMatches.length) revealFind(Math.min(findIndex,findMatches.length-1),false);
  findInput.focus();
}
function replaceEveryMatch(){
  const matches = collectFindMatches();
  if (!matches.length) return;
  let out='', cursor=0;
  for (const hit of matches){
    out += editor.value.slice(cursor,hit.start)+replaceInput.value;
    cursor = hit.end;
  }
  out += editor.value.slice(cursor);
  editor.value = out;
  update();
  refreshFind(false);
  showToast(matches.length+'개 대치됨');
  findInput.focus();
}
btnFind.addEventListener('click',()=>{ if (findOpen) closeFindPanel(); else openFindPanel(); });
findClose.addEventListener('click',()=>closeFindPanel());
findPrev.addEventListener('click',()=>stepFind(-1));
findNext.addEventListener('click',()=>stepFind(1));
replaceOne.addEventListener('click',replaceCurrent);
replaceAll.addEventListener('click',replaceEveryMatch);
findInput.addEventListener('input',()=>refreshFind(true));
findCase.addEventListener('change',()=>refreshFind(true));
findInput.addEventListener('keydown',(e)=>{
  if (e.key==='Enter'){ e.preventDefault(); stepFind(e.shiftKey?-1:1); }
});
replaceInput.addEventListener('keydown',(e)=>{
  if (e.key==='Enter'){ e.preventDefault(); replaceCurrent(); }
});

/* ── stable bidirectional scroll sync ───── */
let pointerOwner = null, recentOwner = null, ownerTimer = null;
function syncEditorGeometry(){
  const scrollbarWidth=Math.max(0,editor.offsetWidth-editor.clientWidth);
  hl.style.right=scrollbarWidth+'px';
}
function mirrorScroll(){
  syncEditorGeometry();
  hl.scrollTop = editor.scrollTop;
  hl.scrollLeft = editor.scrollLeft;
  gutterInner.style.transform = 'translateY('+(-editor.scrollTop)+'px)';
}
window.addEventListener('resize',syncEditorGeometry,{passive:true});
function scrollMax(el){ return el.scrollHeight - el.clientHeight; }
function applyScrollRatio(dst,src){
  const smax=scrollMax(src), dmax=scrollMax(dst);
  if (smax>0 && dmax>0) dst.scrollTop=(src.scrollTop/smax)*dmax;
}
function claimRecentOwner(source,ms=180){
  recentOwner=source;
  clearTimeout(ownerTimer);
  ownerTimer=setTimeout(()=>{ if (recentOwner===source) recentOwner=null; },ms);
}
function canDriveSync(source){
  const owner=pointerOwner||recentOwner;
  return !owner||owner===source;
}
function beginPointerOwner(source){
  pointerOwner=source;
  claimRecentOwner(source,500);
}
editor.addEventListener('pointerdown',()=>beginPointerOwner('editor'),{passive:true});
preview.addEventListener('pointerdown',()=>beginPointerOwner('preview'),{passive:true});
window.addEventListener('pointerup',()=>{
  if (!pointerOwner) return;
  const source=pointerOwner;
  pointerOwner=null;
  claimRecentOwner(source,220);
},{passive:true});
window.addEventListener('pointercancel',()=>{ pointerOwner=null; },{passive:true});
editor.addEventListener('wheel',()=>claimRecentOwner('editor',260),{passive:true});
preview.addEventListener('wheel',()=>claimRecentOwner('preview',260),{passive:true});
editor.addEventListener('touchstart',()=>claimRecentOwner('editor',500),{passive:true});
preview.addEventListener('touchstart',()=>claimRecentOwner('preview',500),{passive:true});
editor.addEventListener('scroll',()=>{
  mirrorScroll();
  if (!syncOn||!canDriveSync('editor')) return;
  claimRecentOwner('editor');
  applyScrollRatio(preview,editor);
},{passive:true});
preview.addEventListener('scroll',()=>{
  if (!syncOn||!canDriveSync('preview')) return;
  claimRecentOwner('preview');
  applyScrollRatio(editor,preview);
  mirrorScroll();
},{passive:true});

/* ── main update ───────────────────────── */

}

/* ── editing helpers ───────────────────── */
function insertText(s){
  editor.setRangeText(s, editor.selectionStart, editor.selectionEnd, 'end');
  update();
}
function wrapSel(marker){
  const st = editor.selectionStart, en = editor.selectionEnd;
  const sel = editor.value.slice(st,en);
  editor.setRangeText(marker+sel+marker, st, en, sel?'end':'start');
  if (!sel) editor.selectionStart = editor.selectionEnd = st+marker.length;
  update();
}
editor.addEventListener('keydown', (e)=>{
  const mod = e.ctrlKey||e.metaKey;
  if (e.key==='Tab' && !e.isComposing){ e.preventDefault(); insertText('  '); }
  else if (mod && e.key.toLowerCase()==='b'){ e.preventDefault(); wrapSel('**'); }
  else if (mod && e.key.toLowerCase()==='i'){ e.preventDefault(); wrapSel('*'); }
});
document.addEventListener('keydown',(e)=>{
  const mod=e.ctrlKey||e.metaKey;
  if (mod&&(e.key.toLowerCase()==='f'||e.key.toLowerCase()==='h')){
    e.preventDefault();
    if (!findOpen) openFindPanel();
    else { findInput.focus(); findInput.select(); }
  } else if (e.key==='Escape'&&findOpen){
    e.preventDefault();
    closeFindPanel();
  }
});

function showToast(msg){

  catch(e){ editor.select(); document.execCommand('copy'); editor.selectionStart = editor.value.length; }
  showToast('클립보드에 복사됨');
});
function renderSaveMenu(){
  saveOptions.forEach(btn=>btn.setAttribute('aria-current',String(btn.dataset.ext===saveExt)));
}
function openSaveMenu(){
  closeFindPanel(false);
  closeTagPanel();
  saveOpen=true;
  renderSaveMenu();
  saveMenu.hidden=false;
  btnSave.setAttribute('aria-expanded','true');
  requestAnimationFrame(()=>requestAnimationFrame(()=>saveMenu.classList.add('open')));
}
function closeSaveMenu(){
  if (!saveOpen&&saveMenu.hidden) return;
  saveOpen=false;
  saveMenu.classList.remove('open');
  btnSave.setAttribute('aria-expanded','false');
  setTimeout(()=>{ if (!saveOpen) saveMenu.hidden=true; },180);
}
function downloadDocument(ext=saveExt){
  const allowed=new Set(['md','txt','markdown']);
  if (!allowed.has(ext)) ext='md';
  saveExt=ext;
  store.set(LS.ext,ext);
  const first=(editor.value.match(/^#\s+(.+)$/m)||[])[1];
  const name=(first?first.replace(/<[^>]*>/g,'').trim().replace(/[\\/:*?"<>|]/g,'').slice(0,40):'')||'document';
  const mime=ext==='txt'?'text/plain;charset=utf-8':'text/markdown;charset=utf-8';
  const filename=name+'.'+ext;
  const file=new File([editor.value],filename,{type:mime});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(file);
  a.download=filename;
  a.style.display='none';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{
    a.remove();
    URL.revokeObjectURL(a.href);
  },1000);
  renderSaveMenu();
  closeSaveMenu();
  showToast(name+'.'+ext+' 저장됨');
}
btnSave.addEventListener('click',()=>{ if (saveOpen) closeSaveMenu(); else openSaveMenu(); });
saveOptions.forEach(btn=>btn.addEventListener('click',()=>downloadDocument(btn.dataset.ext)));
document.addEventListener('pointerdown',(e)=>{
  if (saveOpen&&!saveMenu.contains(e.target)&&!btnSave.contains(e.target)) closeSaveMenu();
});
document.addEventListener('keydown',(e)=>{
  const mod=e.ctrlKey||e.metaKey;
  if (mod&&e.key.toLowerCase()==='s'){
    e.preventDefault();
    downloadDocument(saveExt);
  } else if (e.key==='Escape'&&saveOpen){
    e.preventDefault();
    closeSaveMenu();
  }
});

/* ── sample & init ─────────────────────── */
const SAMPLE = `# RP 프롬프트: 달빛 도서관의 현자

<character name="아리아" age="127" role="고대 도서관의 수호자">

2. 비유를 즐겨 사용

</character>

여기까지가 샘플입니다. 전체를 지우고 바로 작성을 시작하면 됩니다.
**자동 저장**되며, 단축키: \`Ctrl+B\` 굵게 | \`Ctrl+I\` 기울임 | \`Ctrl+S\` 최근 선택 형식으로 저장`;

const savedContent = store.get(LS.content);
editor.value = savedContent!==null ? savedContent : SAMPLE;
setTheme(store.get(LS.theme) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
syncOn = store.get(LS.sync)!=='off';
tagsOn = store.get(LS.tags)!=='off';
htmlOn = store.get(LS.html)==='on';
saveExt = ['md','txt','markdown'].includes(store.get(LS.ext)) ? store.get(LS.ext) : 'md';
/* ── 메모: 미리보기 드래그 → 기록 ────── */
let memos = [];
let memoPanelOpen = false, memoCardOpen = false, activeMemoId = null, draftMemo = null, pendingSel = null;
const MEMO_CTX = 28;

function newMemoId(){ return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function previewText(){ return preview.textContent || ''; }
function loadMemos(){
  try { memos = JSON.parse(store.get(LS.memos) || '[]'); } catch(e){ memos = []; }
  if (!Array.isArray(memos)) memos = [];
  renderMemoHighlights();
}
function persistMemos(){ store.set(LS.memos, JSON.stringify(memos)); }

/* 사용자 선택 영역을 미리보기 문자 오프셋으로 환산 */
function selectionRangeInPreview(){
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const range = sel.getRangeAt(0);
  if (!preview.contains(range.commonAncestorContainer)) return null;
  const text = range.toString();
  if (!text.trim()) return null;
  const pre = document.createRange();
  pre.selectNodeContents(preview);
  pre.setEnd(range.startContainer, range.startOffset);
  const start = pre.toString().length;
  return { start, end:start+text.length, text, rect:range.getBoundingClientRect() };
}

/* 본문이 수정되어도 인용문·전후 문맥으로 위치를 다시 잡는다 */
function anchorMemo(memo, text){
  const hits = [];
  let pos = 0;
  while ((pos = text.indexOf(memo.quote, pos)) !== -1){ hits.push(pos); pos += Math.max(memo.quote.length, 1); }
  if (!hits.length){ memo.orphan = true; return null; }
  memo.orphan = false;
  let best = hits[0], bestScore = -1;
  for (const h of hits){
    let score = 0;
    if (memo.before){
      const b = text.slice(Math.max(0, h-memo.before.length), h);
      score += (b === memo.before) ? 2 : (b.endsWith(memo.before.slice(-6)) ? 1 : 0);
    }
    if (memo.after){
      const a = text.slice(h+memo.quote.length, h+memo.quote.length+memo.after.length);
      score += (a === memo.after) ? 2 : (a.startsWith(memo.after.slice(0,6)) ? 1 : 0);
    }
    if (Math.abs(h - (memo.start||0)) < 40) score += 1;
    if (score > bestScore){ bestScore = score; best = h; }
  }
  memo.start = best;
  return { start:best, end:best+memo.quote.length, memo };
}

function renderMemoCountUi(){
  const n = memos.length;
  memoCount.textContent = String(n);
  memoCount.hidden = n === 0;
  memoPanelCount.textContent = String(n);
  btnMemo.setAttribute('aria-pressed', String(n > 0));
}

function renderMemoHighlights(){
  if (!preview) return;
  unwrapMarks(preview, 'mark.ov-memo');
  const text = previewText();
  const ranges = [];
  for (const m of memos){
    const r = anchorMemo(m, text);
    if (r) ranges.push(r);
  }
  ranges.sort((a,b)=> a.start - b.start || b.end - a.end);
  const clean = [];
  let lastEnd = -1;
  for (const r of ranges){ if (r.start >= lastEnd){ clean.push(r); lastEnd = r.end; } }
  paintRanges(preview, clean, {
    cls:'ov-memo',
    isCurrent:r=>r.memo.id === activeMemoId,
    memoId:r=>r.memo.id,
    title:r=>r.memo.note
  });
  renderMemoCountUi();
  if (memoPanelOpen) renderMemoList();
}

function clampToViewport(el, cx, y){
  const r = el.getBoundingClientRect();
  const pad = 8;
  let left = cx - r.width/2;
  left = Math.min(Math.max(pad, left), Math.max(pad, innerWidth - r.width - pad));
  let top = y;
  if (top + r.height + pad > innerHeight) top = Math.max(pad, y - r.height - 30);
  el.style.left = Math.round(left)+'px';
  el.style.top = Math.round(top)+'px';
}

function showMemoBubble(sel){
  pendingSel = sel;
  memoBubble.hidden = false;
  requestAnimationFrame(()=>{
    clampToViewport(memoBubble, sel.rect.left + sel.rect.width/2, sel.rect.bottom + 8);
    memoBubble.classList.add('open');
  });
}
function hideMemoBubble(){
  pendingSel = null;
  if (memoBubble.hidden) return;
  memoBubble.classList.remove('open');
  setTimeout(()=>{ if (!memoBubble.classList.contains('open')) memoBubble.hidden = true; }, 160);
}

function openMemoCard(opts){
  const sel = pendingSel;
  hideMemoBubble();
  closeSaveMenu();
  closeTagPanel();
  memoCardOpen = true;
  draftMemo = opts.draft || null;
  activeMemoId = opts.memo ? opts.memo.id : null;
  const quote = opts.memo ? opts.memo.quote : (draftMemo ? draftMemo.quote : '');
  memoCardQuote.textContent = quote.length > 140 ? quote.slice(0,140)+'…' : quote;
  memoCardInput.value = opts.memo ? (opts.memo.note || '') : '';
  memoDelete.hidden = !opts.memo;
  memoCard.hidden = false;
  const rect = opts.rect || (sel && sel.rect) || preview.getBoundingClientRect();
  requestAnimationFrame(()=>{
    clampToViewport(memoCard, rect.left + rect.width/2, rect.bottom + 10);
    memoCard.classList.add('open');
    memoCardInput.focus();
  });
  renderMemoHighlights();
}
function closeMemoCard(){
  if (!memoCardOpen) return;
  memoCardOpen = false;
  draftMemo = null;
  activeMemoId = null;
  memoCard.classList.remove('open');
  setTimeout(()=>{ if (!memoCardOpen) memoCard.hidden = true; }, 180);
  renderMemoHighlights();
}

memoAdd.addEventListener('click', ()=>{
  if (!pendingSel) return;
  const sel = pendingSel;
  const text = previewText();
  const draft = {
    id: newMemoId(),
    quote: sel.text,
    before: text.slice(Math.max(0, sel.start-MEMO_CTX), sel.start),
    after: text.slice(sel.end, sel.end+MEMO_CTX),
    start: sel.start,
    note: '',
    created: Date.now()
  };
  openMemoCard({ draft, rect: sel.rect });
});

memoSave.addEventListener('click', ()=>{
  const note = memoCardInput.value.trim();
  if (draftMemo){
    if (!note){ showToast('메모 내용을 입력해 주세요'); memoCardInput.focus(); return; }
    draftMemo.note = note;
    memos.push(draftMemo);
    persistMemos();
    showToast('메모를 추가했습니다');
  } else if (activeMemoId){
    const m = memos.find(x=>x.id === activeMemoId);
    if (m){
      if (!note){ memos = memos.filter(x=>x.id !== activeMemoId); showToast('메모를 삭제했습니다'); }
      else { m.note = note; showToast('메모를 수정했습니다'); }
      persistMemos();
    }
  }
  const s = window.getSelection(); if (s) s.removeAllRanges();
  closeMemoCard();
});
memoDelete.addEventListener('click', ()=>{
  if (activeMemoId){
    memos = memos.filter(x=>x.id !== activeMemoId);
    persistMemos();
    showToast('메모를 삭제했습니다');
  }
  closeMemoCard();
});
memoCancel.addEventListener('click', ()=>closeMemoCard());
memoCardInput.addEventListener('keydown', e=>{
  if (e.key === 'Escape'){ e.preventDefault(); closeMemoCard(); }
  else if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); memoSave.click(); }
});

function handlePreviewSelection(){
  if (memoCardOpen) return;
  const sel = selectionRangeInPreview();
  if (!sel){ hideMemoBubble(); return; }
  showMemoBubble(sel);
}
preview.addEventListener('mouseup', ()=>setTimeout(handlePreviewSelection, 0));
preview.addEventListener('touchend', ()=>setTimeout(handlePreviewSelection, 0));
preview.addEventListener('click', e=>{
  if (e.target.closest('a')) return;
  const mk = e.target.closest('mark.ov-memo');
  if (!mk) return;
  const m = memos.find(x=>x.id === mk.dataset.memo);
  if (!m) return;
  e.preventDefault();
  openMemoCard({ memo:m, rect: mk.getBoundingClientRect() });
});

function renderMemoList(){
  if (!memos.length){
    memoList.innerHTML = '<div class="memo-empty">아직 메모가 없습니다.<br>미리보기에서 텍스트를 드래그해 보세요.</div>';
    return;
  }
  memoList.innerHTML = '';
  [...memos].reverse().forEach(m=>{
    const row = document.createElement('div');
    row.className = 'memo-row';
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'memo-item' + (m.orphan ? ' memo-orphan' : '');
    item.dataset.tooltip = m.orphan ? '원문에서 이 인용을 찾지 못했습니다' : '클릭하면 해당 위치로 이동';
    const q = document.createElement('div');
    q.className = 'memo-item-q';
    q.innerHTML = ICON.memo + '<span class="t"></span>';
    q.querySelector('.t').textContent = m.quote;
    const n = document.createElement('div');
    n.className = 'memo-item-n';
    n.textContent = m.note;
    item.append(q, n);
    item.addEventListener('click', ()=>jumpToMemo(m));
    const x = document.createElement('button');
    x.type = 'button';
    x.className = 'memo-item-x';
    x.innerHTML = ICON.trash;
    x.dataset.tooltip = '메모 삭제';
    x.setAttribute('aria-label', '메모 삭제');
    x.addEventListener('click', ev=>{
      ev.stopPropagation();
      memos = memos.filter(v=>v.id !== m.id);
      persistMemos();
      renderMemoHighlights();
      showToast('메모를 삭제했습니다');
    });
    row.append(item, x);
    memoList.appendChild(row);
  });
}
function jumpToMemo(m){
  activeMemoId = m.id;
  renderMemoHighlights();
  const mk = preview.querySelector('mark.ov-memo[data-memo="'+m.id+'"]');
  if (!mk){ showToast('원문에서 해당 부분을 찾을 수 없습니다'); return; }
  claimRecentOwner('preview', 400);
  mk.scrollIntoView({ block:'center', behavior:'smooth' });
}

function openMemoPanel(){
  closeFindPanel(false);
  closeSaveMenu();
  closeTagPanel();
  memoPanelOpen = true;
  memoPanel.hidden = false;
  btnMemo.setAttribute('aria-expanded','true');

  requestAnimationFrame(()=>requestAnimationFrame(()=>memoPanel.classList.add('open')));

function closeMemoPanel(){
  if (!memoPanelOpen && memoPanel.hidden) return;
  memoPanelOpen = false;
  memoPanel.classList.remove('open');
  btnMemo.setAttribute('aria-expanded','false');

}
btnMemo.addEventListener('click', ()=>{ memoPanelOpen ? closeMemoPanel() : openMemoPanel(); });
memoPanelClose.addEventListener('click', ()=>closeMemoPanel());

document.addEventListener('pointerdown', e=>{

document.addEventListener('keydown', e=>{

loadMemos();
applyToggles();
renderSaveMenu();
update();
updateCursor();

initTocEvents();
preview.addEventListener('scroll', () => {

/* ── Tooltip System (Emil Kowalski Philosophy) ── */
const tooltipEl = document.createElement('div');
tooltipEl.className = 'app-tooltip';
tooltipEl.id = 'appTooltip';
tooltipEl.setAttribute('role', 'tooltip');
tooltipEl.hidden = true;
document.body.appendChild(tooltipEl);

let tooltipTimer = null;
let cooldownTimer = null;
let isTooltipWarm = false;
let currentTooltipTarget = null;

function parseTooltipContent(text) {
  if (!text) return '';
  const match = text.match(/\s*\((Ctrl\+[A-Z0-9]+|Shift\+[A-Za-z0-9]+|Esc|Enter|Ctrl\+S|Ctrl\+F)\)$/i);
  if (match) {
    const mainText = text.slice(0, match.index).trim();
    const shortcut = match[1];
    return '<span>' + escapeHtml(mainText) + '</span><kbd class="tip-kbd">' + escapeHtml(shortcut) + '</kbd>';
  }
  return '<span>' + escapeHtml(text) + '</span>';
}

function showTooltip(el) {
  const text = el.dataset.tooltip;
  if (!text) return;
  currentTooltipTarget = el;
  clearTimeout(tooltipTimer);
  clearTimeout(cooldownTimer);

  const render = () => {
    if (currentTooltipTarget !== el) return;
    tooltipEl.innerHTML = parseTooltipContent(text);
    tooltipEl.hidden = false;
    
    const rect = el.getBoundingClientRect();
    const tipRect = tooltipEl.getBoundingClientRect();
    
    let top = rect.bottom + 6;
    if (top + tipRect.height > window.innerHeight - 8) {
      top = rect.top - tipRect.height - 6;
    }
    
    let left = rect.left + (rect.width / 2) - (tipRect.width / 2);
    left = Math.max(8, Math.min(window.innerWidth - tipRect.width - 8, left));
    
    tooltipEl.style.top = Math.round(top) + 'px';
    tooltipEl.style.left = Math.round(left) + 'px';

    if (isTooltipWarm) {
      tooltipEl.classList.add('instant');
      tooltipEl.classList.add('visible');
    } else {
      tooltipEl.classList.remove('instant');
      requestAnimationFrame(() => {
        if (currentTooltipTarget === el) tooltipEl.classList.add('visible');
      });
    }
    isTooltipWarm = true;
  };

  if (isTooltipWarm) {
    render();
  } else {
    tooltipTimer = setTimeout(render, 180);
  }
}

function hideTooltip(el) {
  if (currentTooltipTarget === el) {
    currentTooltipTarget = null;
    clearTimeout(tooltipTimer);
    tooltipEl.classList.remove('visible');
    tooltipEl.classList.remove('instant');
    
    clearTimeout(cooldownTimer);
    cooldownTimer = setTimeout(() => {
      isTooltipWarm = false;
      tooltipEl.hidden = true;
    }, 260);
  }
}

document.addEventListener('pointerover', (e) => {
  const target = e.target.closest('[data-tooltip]');
  if (target) showTooltip(target);
});
document.addEventListener('pointerout', (e) => {
  const target = e.target.closest('[data-tooltip]');
  if (target) hideTooltip(target);
});
document.addEventListener('pointerdown', () => {
  if (currentTooltipTarget) hideTooltip(currentTooltipTarget);
  isTooltipWarm = false;
  tooltipEl.hidden = true;
});
window.addEventListener('scroll', () => {
  if (currentTooltipTarget) hideTooltip(currentTooltipTarget);
}, { passive: true });
